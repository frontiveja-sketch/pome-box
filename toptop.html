<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3E9DD">
<meta name="description" content="ワインそそぎ分けパズル。同じワインだけを注ぎ足して、1本ずつ銘柄をそろえよう。広告なし・アンドゥ無制限・ブラウザ内保存。POME BOX。">
<title>とぽとぽ — ワインそそぎ分けパズル</title>
<style>
:root{
--bg1:#F3E9DD; --bg2:#E4D2BF; --ink:#3A2A22; --muted:#9A8574;
--rack:#B08A5E; --rack2:#8F6B44; --rackShadow:rgba(60,40,20,.28);
--glass:rgba(255,252,248,.40); --glassEdge:rgba(120,95,75,.55);
--accent:#8E2035; --accentDark:#6A1526; --gold:#E6B54F;
--seg-h:32px; --body-w:46px; --neck-w:16px; --neck-h:26px; --gap-x:14px; --gap-y:16px;
--c0:#E8432E; --c1:#F2913A; --c2:#F4C430; --c3:#43B02A;
--c4:#17A2B8; --c5:#2E6FD6; --c6:#7E4FA0; --c7:#E86AA6;
--c8:#9CCC3A; --c9:#8B5E3C; --c10:#8A93A3; --c11:#12BCB0;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; height:100%;}
body{
font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
color:var(--ink);
background:radial-gradient(130% 100% at 50% 0%, #FBF6EF 0%, var(--bg1) 44%, var(--bg2) 100%);
min-height:100dvh; display:flex; flex-direction:column; align-items:center;
padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px);
overflow-x:hidden; user-select:none; -webkit-user-select:none;
}
header{width:100%; max-width:560px; margin:12px auto 2px; text-align:center; position:relative;}
.title{
font-weight:800; letter-spacing:.02em; margin:0; color:var(--ink);
font-size:clamp(24px,6.5vw,34px);
}
.title .drop{color:var(--accent);}
.sub{margin:3px 0 0; font-size:12px; letter-spacing:.14em; color:var(--muted);}
.settings{position:absolute; top:0; right:0; display:flex; gap:8px;}
.tgl{
width:36px; height:36px; border-radius:50%; background:#fff; border:1.5px solid var(--glassEdge);
color:var(--ink); font-size:16px; cursor:pointer; line-height:1; display:flex; align-items:center; justify-content:center;
box-shadow:0 1px 3px rgba(40,60,80,.12); transition:transform .08s, opacity .15s, background .15s;
}
.tgl:active{transform:scale(.92);}
.tgl[aria-pressed="false"]{opacity:.45;}
.tgl.on{background:#F6E7EA; border-color:var(--accent);}
.hud{
width:100%; max-width:560px; margin:14px auto 4px;
display:flex; justify-content:space-between; align-items:center; gap:10px;
font-variant-numeric:tabular-nums;
}
.stat{display:flex; flex-direction:column; line-height:1.05;}
.stat b{font-size:20px; font-weight:800; color:var(--ink);}
.stat small{font-size:10px; letter-spacing:.12em; color:var(--muted);}
.stat.c{text-align:center;} .stat.r{text-align:right;}
main{flex:1; width:100%; max-width:560px; display:flex; align-items:center; justify-content:center;}
.rack{
width:100%; display:flex; flex-wrap:wrap; justify-content:center;
gap:var(--gap-y) var(--gap-x);
padding:20px 12px 16px;
}
.tube{
background:none; border:0; padding:4px 2px 0; cursor:pointer; position:relative;
display:flex; flex-direction:column; align-items:center;
transition:transform .16s cubic-bezier(.34,1.56,.64,1);
}
.tube:focus-visible{outline:2px solid var(--accent); outline-offset:4px; border-radius:8px;}
.tube .neck{
position:relative; width:var(--neck-w); height:var(--neck-h);
background:var(--glass); border:1.5px solid var(--glassEdge); border-bottom:0;
border-radius:5px 5px 0 0; z-index:2;
}
.tube .neck .foil{
position:absolute; top:-1px; left:-1px; right:-1px; height:38%;
background:linear-gradient(180deg,#7A1020,#571020); border-radius:5px 5px 2px 2px;
}
.tube .body{
position:relative; width:var(--body-w); height:calc(var(--seg-h) * 4 + 6px);
background:var(--glass); border:1.5px solid var(--glassEdge);
border-radius:13px 13px 16px 16px; overflow:hidden; margin-top:-1px;
display:flex; flex-direction:column-reverse;
box-shadow:inset -7px 0 12px rgba(70,40,45,.12), inset 6px 0 8px rgba(255,255,255,.30);
}
.tube .body::after{ /* vertical glass highlight */
content:""; position:absolute; top:8px; left:8px; width:6px; height:66%; z-index:3;
border-radius:6px; pointer-events:none;
background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,0));
}
.seg{ height:var(--seg-h); width:100%; position:relative; transform-origin:bottom; }
.seg.grow{animation:grow .22s cubic-bezier(.2,.8,.3,1);}
@keyframes grow{from{transform:scaleY(.05); opacity:.5;} to{transform:scaleY(1); opacity:1;}}
.tube.sel{transform:translateY(-16px);}
.tube.sel .body{border-color:var(--accent); box-shadow:0 0 0 2px rgba(142,32,53,.38), inset -7px 0 12px rgba(70,40,45,.12);}
.tube.pouring{transform:translateY(-46px) rotate(calc(var(--dir,1) * -32deg)); transition:transform .16s ease; z-index:6;}
.tube.hintf .body{animation:hintf .5s ease 2;}
@keyframes hintf{0%,100%{box-shadow:inset -7px 0 12px rgba(70,40,45,.12);} 50%{box-shadow:0 0 0 3px var(--gold);}}
.tube.done .neck .foil{background:linear-gradient(180deg,var(--gold),#c99a34);}
.tube.done .body::before{
content:"\2713"; position:absolute; z-index:4; top:3px; left:50%; transform:translateX(-50%);
font-size:12px; font-weight:800; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.3);
}
.fx{position:fixed; inset:0; z-index:5; pointer-events:none; overflow:visible;}
.stream{position:fixed; height:8px; border-radius:6px; transform-origin:left center; box-shadow:0 0 8px rgba(0,0,0,.15); opacity:0;}
.stream.go{animation:stream .34s ease forwards;}
@keyframes stream{0%{opacity:0; clip-path:inset(0 100% 0 0);} 22%{opacity:1; clip-path:inset(0 0 0 0);} 78%{opacity:1; clip-path:inset(0 0 0 0);} 100%{opacity:0; clip-path:inset(0 0 0 90%);}}
.controls{width:100%; max-width:560px; margin:14px auto 6px; display:flex; gap:9px; justify-content:center;}
.btn{
flex:1; max-width:150px; background:#fff; color:var(--ink);
border:1.5px solid var(--glassEdge); border-radius:13px; padding:12px 6px;
font-size:13px; font-weight:700; letter-spacing:.03em; cursor:pointer;
display:flex; flex-direction:column; align-items:center; gap:3px;
box-shadow:0 2px 5px rgba(40,60,80,.10); transition:transform .08s, background .15s;
}
.btn:active{transform:translateY(1px) scale(.98);}
.btn:disabled{opacity:.4; cursor:default;}
.btn .ic{font-size:19px; line-height:1;}
.btn .cnt{font-size:10px; color:var(--muted); font-weight:700;}
.toast{
position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 96px); transform:translateX(-50%) translateY(12px);
background:#2B3A4Aee; color:#fff; padding:10px 16px; border-radius:20px; font-size:13px;
opacity:0; pointer-events:none; transition:.25s; z-index:40; max-width:90vw; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.overlay{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:20px;
background:rgba(43,58,74,.42); backdrop-filter:blur(3px);}
.overlay.show{display:flex; animation:fade .3s ease;}
@keyframes fade{from{opacity:0;} to{opacity:1;}}
.card{background:#fff; border-radius:22px; padding:28px 26px; text-align:center; max-width:330px; width:100%;
box-shadow:0 24px 60px rgba(30,45,60,.35);}
.card.pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{from{transform:scale(.8); opacity:0;} to{transform:scale(1); opacity:1;}}
.card .k{font-size:42px; margin-bottom:6px;}
.card h2{margin:0 0 4px; font-size:22px; color:var(--ink);}
.card p{margin:0 0 20px; color:var(--muted); font-size:13px;}
.card .row{display:flex; gap:10px;}
.card .btn.primary{flex-direction:row; background:linear-gradient(180deg,var(--accent),var(--accentDark)); color:#fff; border-color:transparent; box-shadow:0 6px 16px rgba(12,126,118,.35);}
.card .btn{flex-direction:row;}
footer{margin:16px auto 4px; font-size:11px; color:var(--muted); letter-spacing:.08em; text-align:center;}
footer a{color:var(--muted);}
@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important;} }
</style>
</head>
<body>
<header>
<div class="settings">
<button class="tgl on" id="tSound" aria-pressed="true" title="音のオン/オフ">🔊</button>
</div>
<h1 class="title">とぽ<span class="drop">とぽ</span></h1>
<p class="sub">ワインそそぎ分け ／ 同じ銘柄をそろえよう</p>
</header>
<div class="hud">
<div class="stat"><b id="lv">1</b><small>レベル</small></div>
<div class="stat c"><b id="mv">0</b><small>てすう</small></div>
<div class="stat r"><b id="best">1</b><small>さいこう</small></div>
</div>
<main><div class="rack" id="rack" aria-label="ワインボトル"></div></main>
<div class="controls">
<button class="btn" id="undo"><span class="ic">↩</span>もどす</button>
<button class="btn" id="addtube"><span class="ic">＋</span>ボトル<span class="cnt" id="addcnt">×2</span></button>
<button class="btn" id="hint"><span class="ic">💡</span>ヒント</button>
<button class="btn" id="restart"><span class="ic">↺</span>最初から</button>
</div>
<footer>同じワインだけ注ぎ足せます。1本ずつ銘柄をそろえて、全部そろえたらクリア。 · <a href="./">POME BOX</a></footer>
<div class="fx" id="fx" aria-hidden="true"></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay">
<div class="card">
<div class="k">🍷</div>
<h2 id="winTitle">きれいにそろいました！</h2>
<p id="winSub"></p>
<div class="row">
<button class="btn" id="replay">もう一度</button>
<button class="btn primary" id="next">つぎのレベル →</button>
</div>
</div>
</div>
<script>
const CAP = 4;
const EMPTIES = 2;               // classic: always 2 spare tubes
function difficultyForLevel(l){
const nColors = Math.min(3 + Math.floor((l - 1) / 2), 12);
return { nColors, empties: EMPTIES };
}
const clone = t => t.map(x => x.slice());
const topColor = t => t.length ? t[t.length-1] : null;
function topRun(t){ if(!t.length) return 0; const c=t[t.length-1]; let n=1; for(let k=t.length-2;k>=0&&t[k]===c;k--)n++; return n; }
const freeSpace = t => CAP - t.length;
const isMono = t => t.length ? t.every(x=>x===t[0]) : true;
function canPour(tubes, from, to){
if(from===to) return false;
const s=tubes[from], d=tubes[to];
if(!s.length) return false;
if(d.length>=CAP) return false;
if(d.length && d[d.length-1]!==s[s.length-1]) return false;
return true;
}
function pour(tubes, from, to){
if(!canPour(tubes,from,to)) return 0;
const amt=Math.min(topRun(tubes[from]), freeSpace(tubes[to]));
const col=tubes[from][tubes[from].length-1];
for(let i=0;i<amt;i++){ tubes[to].push(col); tubes[from].pop(); }
return amt;
}
function isSolved(tubes){
return tubes.every(t => t.length===0 || (t.length===CAP && isMono(t)));
}
function solve(tubesIn, nodeCap=200000){
const visited=new Set(); let nodes=0;
const canon=ts=>ts.map(t=>t.join(',')).sort().join('|');
const solved=ts=>ts.every(t=>t.length===0||(t.length===CAP&&t.every(x=>x===t[0])));
function dfs(ts){
if(++nodes>nodeCap) return null;
if(solved(ts)) return [];
const key=canon(ts); if(visited.has(key)) return null; visited.add(key);
const moves=[];
for(let i=0;i<ts.length;i++){
const from=ts[i]; if(!from.length) continue;
if(from.length===CAP && from.every(x=>x===from[0])) continue;
const col=from[from.length-1], mono=from.every(x=>x===col);
let run=1; for(let k=from.length-2;k>=0&&from[k]===col;k--) run++;
for(let j=0;j<ts.length;j++){
if(i===j) continue; const to=ts[j];
if(to.length>=CAP) continue;
if(to.length && to[to.length-1]!==col) continue;
if(to.length===0 && mono) continue;
const amt=Math.min(run, CAP-to.length);
let score=0; if(to.length) score+=5; if(to.length+amt===CAP) score+=10; if(to.length===0) score-=2;
moves.push({i,j,amt,score});
}
}
moves.sort((a,b)=>b.score-a.score);
for(const m of moves){
const nt=ts.map(t=>t.slice());
for(let c=0;c<m.amt;c++) nt[m.j].push(nt[m.i].pop());
const r=dfs(nt); if(r!==null){ r.unshift([m.i,m.j]); return r; }
}
return null;
}
return dfs(tubesIn.map(t=>t.slice()));
}
function shuffle(a,rng){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function deal(nColors, rng, empties=EMPTIES){
const pool=[]; for(let c=0;c<nColors;c++) for(let k=0;k<CAP;k++) pool.push(c);
shuffle(pool,rng);
const tubes=[]; for(let c=0;c<nColors;c++) tubes.push(pool.slice(c*CAP,(c+1)*CAP));
for(let e=0;e<empties;e++) tubes.push([]);
return tubes;
}
function generateLevel(level, rng=Math.random, maxTries=120){
let { nColors, empties } = difficultyForLevel(level);
while(nColors>=2){
for(let t=0;t<maxTries;t++){
const tubes=deal(nColors, rng, empties);
if(isSolved(tubes)) continue;
const path=solve(tubes, 160000);
if(path) return { tubes, nColors, empties, solutionLength:path.length };
}
nColors--;
}
return { tubes: deal(3,rng,empties), nColors:3, empties, solutionLength:null };
}
const SAVE_KEY='toptop_wine_v1', META_KEY='toptop_wine_meta';
const START_LEVEL=1;
const ADD_TUBES_PER_LEVEL=2;
const $=s=>document.querySelector(s);
let state=null;          // {level, tubes, initial, moves, history:[], addsLeft}
let sel=null, lock=false, winShown=false, maxLevel=1;
let soundOn=true;
const rack=$('#rack'), fx=$('#fx');
const audio={
ctx:null, master:null,
ensure(){ if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
this.ctx=new AC(); this.master=this.ctx.createGain(); this.master.gain.value=.9; this.master.connect(this.ctx.destination); },
note(f,d=.12,type='sine',v=.16,at=0){ if(!soundOn||!this.ctx) return;
const t=this.ctx.currentTime+at, o=this.ctx.createOscillator(), g=this.ctx.createGain();
o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.012);
g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(this.master); o.start(t); o.stop(t+d+.02); },
select(){ this.note(600,.07,'triangle',.12); },
pour(a){ this.note(520,.09,'sine',.15); this.note(300+(a||1)*30,.14,'sine',.15,.06); },
invalid(){ this.note(150,.14,'square',.10); },
undo(){ this.note(360,.08,'triangle',.12); this.note(300,.08,'triangle',.10,.05); },
done(){ [660,880,1175].forEach((f,i)=>this.note(f,.20,'triangle',.15,i*.06)); },
win(){ [523,659,784,1047].forEach((f,i)=>this.note(f,.32,'triangle',.16,i*.11)); },
add(){ this.note(440,.10,'sine',.14); this.note(660,.12,'sine',.12,.06); }
};
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify({level:state.level,tubes:state.tubes,initial:state.initial,moves:state.moves,history:state.history.slice(-200),addsLeft:state.addsLeft})); }catch(e){} }
function saveMeta(){ try{ localStorage.setItem(META_KEY, JSON.stringify({maxLevel,soundOn})); }catch(e){} }
function loadMeta(){ try{ const m=JSON.parse(localStorage.getItem(META_KEY)); if(m){ if(m.maxLevel)maxLevel=m.maxLevel; if(typeof m.soundOn==='boolean')soundOn=m.soundOn; } }catch(e){} }
const BASE={seg:32,body:46,neckW:16,neckH:26,gapX:14,gapY:16};
function fitBoard(count){
const availW=Math.max(220,(rack.clientWidth||536)-24);
const vh=window.innerHeight||720; const rackTop=rack.getBoundingClientRect?rack.getBoundingClientRect().top:0;
const availH=Math.max(220,(rackTop>0?vh-rackTop:vh-250)-128);
let s=0.55;
for(let k=1.0;k>=0.55;k-=0.04){
const tw=BASE.body*k, seg=BASE.seg*k, gx=BASE.gapX*k, gy=BASE.gapY*k;
const th=BASE.neckH*k + seg*4 + 6;
const cols=Math.max(1,Math.floor((availW+gx)/(tw+gx)));
const rows=Math.ceil(count/cols);
if(rows*th+(rows-1)*gy<=availH){ s=k; break; }
}
const r=document.documentElement.style, px=v=>Math.round(v*s)+'px';
r.setProperty('--seg-h',px(BASE.seg)); r.setProperty('--body-w',px(BASE.body));
r.setProperty('--neck-w',px(BASE.neckW)); r.setProperty('--neck-h',px(BASE.neckH));
r.setProperty('--gap-x',px(BASE.gapX)); r.setProperty('--gap-y',px(BASE.gapY));
}
function makeSeg(color,grow){
const seg=document.createElement('div'); seg.className='seg'+(grow?' grow':''); seg.style.background=`var(--c${color})`;
return seg;
}
function makeTube(i,tube){
const el=document.createElement('button'); el.className='tube'; el.setAttribute('aria-label',`ボトル ${i+1}`);
if(i===sel) el.classList.add('sel');
if(tube.length===CAP && isMono(tube)) el.classList.add('done');
el.innerHTML='<div class="neck"><span class="foil"></span></div><div class="body"></div>';
const body=el.querySelector('.body'); tube.forEach(c=>body.appendChild(makeSeg(c,false)));
el.addEventListener('click',()=>onTubeClick(i)); return el;
}
function render(){
fitBoard(state.tubes.length);
rack.innerHTML='';
state.tubes.forEach((t,i)=>rack.appendChild(makeTube(i,t)));
$('#lv').textContent=state.level; $('#mv').textContent=state.moves; $('#best').textContent=maxLevel;
$('#undo').disabled=state.history.length===0||lock;
$('#addcnt').textContent='×'+state.addsLeft; $('#addtube').disabled=state.addsLeft<=0||lock;
}
function loadLevel(level){
const g=generateLevel(level);
state={level,tubes:g.tubes,initial:clone(g.tubes),moves:0,history:[],addsLeft:ADD_TUBES_PER_LEVEL};
sel=null; winShown=false; hideWin(); maxLevel=Math.max(maxLevel,level); saveMeta(); render(); save();
}
function restart(){ if(lock) return; state.tubes=clone(state.initial); state.moves=0; state.history=[]; state.addsLeft=ADD_TUBES_PER_LEVEL; sel=null; winShown=false; hideWin(); render(); save(); }
function onTubeClick(i){
audio.ensure();
if(lock||winShown) return;
if(sel===null){ if(state.tubes[i].length){ sel=i; audio.select(); render(); } return; }
if(sel===i){ sel=null; render(); return; }
const from=sel; sel=null;
if(canPour(state.tubes,from,i)) attemptPour(from,i);
else{ audio.invalid(); if(state.tubes[i].length){ sel=i; audio.select(); } render(); }
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const raf2=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
async function attemptPour(from,to){
lock=true; const color=topColor(state.tubes[from]); render();
const srcEl=rack.children[from], dstEl=rack.children[to];
const sr=srcEl.getBoundingClientRect(), dr=dstEl.getBoundingClientRect();
const toRight=(dr.left+dr.width/2)>=(sr.left+sr.width/2);
srcEl.style.setProperty('--dir',toRight?-1:1); srcEl.classList.add('pouring');
await raf2();
const sb=srcEl.querySelector('.body').getBoundingClientRect(), db=dstEl.querySelector('.body').getBoundingClientRect();
drawStream(toRight?sb.right-3:sb.left+3, sb.top+3, db.left+db.width/2, db.top+3, color);
await wait(120);
state.history.push({tubes:clone(state.tubes),moves:state.moves,addsLeft:state.addsLeft});
const amt=pour(state.tubes,from,to); state.moves++; audio.pour(amt);
$('#mv').textContent=state.moves;
const srcGlass=srcEl.querySelector('.body'), dstGlass=dstEl.querySelector('.body');
for(let k=0;k<amt;k++) if(srcGlass.lastElementChild) srcGlass.removeChild(srcGlass.lastElementChild);
for(let k=0;k<amt;k++) dstGlass.appendChild(makeSeg(color,true));
const doneNow=state.tubes[to].length===CAP && isMono(state.tubes[to]);
if(doneNow){ dstEl.classList.add('done'); audio.done(); }
await wait(210); srcEl.classList.remove('pouring'); await wait(120);
lock=false; render(); save();
if(isSolved(state.tubes)) onWin();
else if(!hasAnyMove(state.tubes) && state.addsLeft<=0){ toast('手詰まりです。「もどす」か「最初から」でどうぞ'); audio.invalid(); }
}
function hasAnyMove(tubes){ for(let i=0;i<tubes.length;i++){ if(!tubes[i].length) continue; for(let j=0;j<tubes.length;j++){ if(i!==j && canPour(tubes,i,j)) return true; } } return false; }
function drawStream(x1,y1,x2,y2,color){
const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;
const s=document.createElement('div'); s.className='stream'; s.style.left=x1+'px'; s.style.top=(y1-4)+'px';
s.style.width=len+'px'; s.style.transform=`rotate(${ang}deg)`;
s.style.background=`linear-gradient(90deg, var(--c${color}), color-mix(in srgb, var(--c${color}) 72%, #fff))`;
fx.appendChild(s); requestAnimationFrame(()=>s.classList.add('go')); setTimeout(()=>s.remove(),380);
}
function undo(){ if(lock||!state.history.length) return; const p=state.history.pop(); state.tubes=p.tubes; state.moves=p.moves; state.addsLeft=p.addsLeft; sel=null; winShown=false; hideWin(); audio.undo(); render(); save(); }
function addTube(){ if(lock||state.addsLeft<=0) return; state.history.push({tubes:clone(state.tubes),moves:state.moves,addsLeft:state.addsLeft}); state.tubes.push([]); state.addsLeft--; sel=null; audio.add(); render(); save(); toast('空のボトルを1本ふやしました'); }
function hint(){ audio.ensure(); if(lock||winShown) return; const path=solve(clone(state.tubes),260000); if(!path||!path.length){ toast('打てる手がなさそう。もどすかボトルを足してね'); return; } const [f,t]=path[0]; flash(f); flash(t); }
function flash(i){ const el=rack.children[i]; if(!el) return; el.classList.add('hintf'); setTimeout(()=>el.classList.remove('hintf'),1000); }
function onWin(){ winShown=true; maxLevel=Math.max(maxLevel,state.level+1); saveMeta(); audio.win(); $('#winSub').textContent=`レベル ${state.level} を ${state.moves} 手でクリア！`; setTimeout(showWin,240); }
function showWin(){ const c=$('#overlay .card'); c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); $('#overlay').classList.add('show'); }
function hideWin(){ $('#overlay').classList.remove('show'); }
let toastTimer=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1900); }
function applySettingsUI(){ const s=$('#tSound');
s.setAttribute('aria-pressed',String(soundOn)); s.classList.toggle('on',soundOn); s.textContent=soundOn?'🔊':'🔇';
}
$('#tSound').addEventListener('click',()=>{ soundOn=!soundOn; saveMeta(); applySettingsUI(); if(soundOn){ audio.ensure(); audio.select(); } });
$('#undo').addEventListener('click',undo);
$('#addtube').addEventListener('click',addTube);
$('#hint').addEventListener('click',hint);
$('#restart').addEventListener('click',restart);
$('#replay').addEventListener('click',()=>{ hideWin(); restart(); });
$('#next').addEventListener('click',()=>{ hideWin(); loadLevel(state.level+1); });
document.addEventListener('keydown',e=>{ if(e.key==='z'||e.key==='Z')undo(); else if(e.key==='h'||e.key==='H')hint(); else if(e.key==='r'||e.key==='R')restart(); });
window.addEventListener('resize',()=>{ if(state&&!lock) render(); });
(function boot(){
loadMeta(); applySettingsUI(); let resumed=false;
try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY));
if(s&&Array.isArray(s.tubes)&&s.tubes.length){ state={level:s.level,tubes:s.tubes,initial:s.initial||clone(s.tubes),moves:s.moves||0,history:s.history||[],addsLeft:(typeof s.addsLeft==='number'?s.addsLeft:ADD_TUBES_PER_LEVEL)}; sel=null; winShown=false; render(); resumed=true; if(isSolved(state.tubes)) onWin(); }
}catch(e){}
if(!resumed) loadLevel(START_LEVEL);
})();
</script>
</body>
</html>
